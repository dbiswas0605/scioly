services:
  postgres:
    image: postgres:16-alpine
    container_name: scioly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scioly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scioly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scioly}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - scioly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scioly} -d ${POSTGRES_DB:-scioly}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scioly_postgres_data:
